name: Windows installer and Stream Deck plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare official Inno Setup compiler
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile "$env:RUNNER_TEMP\inno.exe"
          $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP\inno.exe"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Compiler signature invalid' }
          $p = Start-Process "$env:RUNNER_TEMP\inno.exe" -ArgumentList '/PORTABLE=1','/VERYSILENT','/SUPPRESSMSGBOXES','/SP-','/NOICONS','/NORESTART',"/DIR=`"$env:RUNNER_TEMP\inno`"" -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Compiler setup failed' }
      - name: Build packages
        shell: pwsh
        run: ./Build.ps1 -Iscc "$env:RUNNER_TEMP\inno\ISCC.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: CrazyBatto-FanAtlas-0.2.0
          path: |
            dist/*.exe
            dist/*.streamDeckPlugin
      - name: Publish first 0.2.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.0 *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists; packages remain available as build artifacts.'; exit 0 }
          gh release create v0.2.0 dist/CrazyBatto-FanAtlas-Setup-0.2.0.exe dist/de.crazybatto.fanatlas.streamDeckPlugin --target "$env:GITHUB_SHA" --title 'Crazy_Batto FanAtlas 0.2.0' --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }

